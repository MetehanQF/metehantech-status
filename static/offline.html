<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0812">
  <title>Baglanti yok / MetehanTech</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b0812;
      color: #e9e4f5;
      font: 15px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .card {
      max-width: 380px;
      text-align: center;
      border: 1px solid rgba(167, 139, 250, 0.16);
      border-radius: 18px;
      background: #100c1a;
      padding: 32px 26px;
    }
    img { width: 72px; height: 72px; }
    h1 { font-size: 18px; margin: 18px 0 8px; letter-spacing: -0.01em; }
    p { margin: 0 0 20px; color: #a99fc0; }
    button {
      appearance: none;
      border: 1px solid rgba(167, 139, 250, 0.30);
      background: rgba(124, 58, 237, 0.18);
      color: #e9e4f5;
      border-radius: 10px;
      padding: 10px 20px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
    button:active { background: rgba(124, 58, 237, 0.32); }
  </style>
</head>
<body>
  <div class="card">
    <img src="/static/icons/icon-192.png" alt="">
    <h1>Panele ulasilamiyor</h1>
    <p>Cihaz cevrimdisi ya da Pi5 su an yanit vermiyor. Control Center verisi guvenlik nedeniyle cihazda saklanmaz.</p>
    <button type="button" onclick="location.reload()">Yeniden dene</button>
  </div>
</body>
</html>
