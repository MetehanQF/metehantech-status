name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Test suite (clean clone, nothing configured)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-subtests
      # The suite must pass on a checkout with no deployment configuration:
      # tests that need live infrastructure skip themselves with a reason.
      - name: Run tests
        run: python -m pytest tests/ -q

  privacy-gate:
    name: Privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for anything identifying a real installation
        run: python3 .github/scripts/privacy_gate.py .
