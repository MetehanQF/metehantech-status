<VirtualHost *:80>
    ServerName cloud.metehantech.com
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 172.30.53.1

    RewriteEngine On
    RewriteRule ^/?\.well-known/(?:card|cal)dav/?$ https://cloud.metehantech.com/remote.php/dav/ [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
