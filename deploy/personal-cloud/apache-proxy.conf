# Cloudflare Tunnel reaches Apache through the fixed Docker frontend gateway.
RemoteIPHeader CF-Connecting-IP
RemoteIPTrustedProxy 172.30.53.1
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

# Relative WebDAV discovery redirects otherwise inherit the origin-side HTTP scheme.
RewriteEngine On
RewriteCond %{HTTP_HOST} =cloud.metehantech.com [NC]
RewriteRule ^/?\.well-known/(?:card|cal)dav/?$ https://cloud.metehantech.com/remote.php/dav/ [R=301,L]
